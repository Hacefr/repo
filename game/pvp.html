<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PvZ: Online Versus Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            background-image: url('game/images/interface/background1.jpg');
            background-size: cover;
            background-position: center;
        }
        .box {
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #48cae4;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            width: 360px;
        }
        h1 { margin-top: 0; color: #ffb703; text-shadow: 2px 2px #000; font-size: 26px; }
        p { font-size: 14px; color: #ccc; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #2a9d8f;
            border: 2px solid #264653;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #e76f51; }
        input {
            width: 90%;
            padding: 10px;
            font-size: 20px;
            text-align: center;
            border-radius: 8px;
            border: none;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .code-display {
            font-size: 38px;
            letter-spacing: 6px;
            color: #06d6a0;
            font-weight: bold;
            margin: 15px 0;
        }
        .credit {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
        }
        .credit a { color: #48cae4; text-decoration: none; }
    </style>
</head>
<body>

<div class="box" id="main-panel">
    <h1>PLANTS vs. ZOMBIES<br><span style="color:#e63946;">VERSUS ONLINE</span></h1>
    <p>1v1 Console-style Competitive Battle</p>
    
    <button class="btn" onclick="createRoom()">HOST MATCH (Plants)</button>
    <div style="margin: 15px 0; color: #777;">— OR JOIN AS ZOMBIES —</div>
    <input type="text" id="join-input" maxlength="4" placeholder="CODE">
    <button class="btn" style="background:#e76f51;" onclick="joinRoom()">JOIN MATCH</button>

    <div class="credit">
        Original assets & port by <a href="https://pvzm.net" target="_blank">PVZM.net</a> / JiangNanGame.<br>
        Multiplayer mod only.
    </div>
</div>

<div class="box" id="host-waiting-panel" style="display:none;">
    <h1>ROOM CREATED</h1>
    <p>Share this code with your friend:</p>
    <div class="code-display" id="room-code-text">----</div>
    <p style="color:#ffb703;">Waiting for opponent to connect...</p>
</div>

<script>
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const socket = new WebSocket(protocol + window.location.host);

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "ROOM_CREATED") {
            document.getElementById("main-panel").style.display = "none";
            document.getElementById("host-waiting-panel").style.display = "block";
            document.getElementById("room-code-text").innerText = msg.code;
        } else if (msg.type === "OPPONENT_READY") {
            // Host launches into the game as Plant!
            const code = document.getElementById("room-code-text").innerText;
            window.location.href = `/game/index.html?ll=pvp_test&room=${code}&role=plant`;
        } else if (msg.type === "ROOM_JOINED") {
            // Guest launches immediately into the game as Zombie!
            window.location.href = `/game/index.html?ll=pvp_test&room=${msg.code}&role=zombie`;
        } else if (msg.type === "ERROR") {
            alert(msg.message);
        }
    };

    function createRoom() {
        socket.send(JSON.stringify({ type: "CREATE_ROOM" }));
    }

    function joinRoom() {
        const code = document.getElementById("join-input").value.trim();
        if (code.length === 4) {
            socket.send(JSON.stringify({ type: "JOIN_ROOM", code }));
        } else {
            alert("Please enter a 4-letter room code!");
        }
    }
</script>
</body>
</html>
